[package]
name = "oracle-desktop"
version = "0.4.0"
description = "A desktop memory reconstruction archive"
authors = ["Emilia Singleton"]
edition = "2021"

[lib]
name = "oracle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
